
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja de Moda</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #222;
    }

    header {
      background: #171717;
      color: white;
      padding: 24px;
      text-align: center;
    }

    .banner {
      text-align: center;
      padding: 60px 20px;
      background: #e8d9c7;
    }

    .banner h2 {
      font-size: 36px;
    }

    button {
      background: #171717;
      color: white;
      padding: 12px 20px;
      border: 0;
      cursor: pointer;
    }

    main {
      padding: 25px;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>VESTE+</h1>
    <p>Moda e acessórios</p>
  </header>

  <section class="banner">
    <h2>Vista seu estilo.</h2>
    <p>Descubra nossa nova coleção.</p>
    <button onclick="mostrarMensagem()">
      Conhecer coleção
    </button>
  </section>

  <main>
    <h2>Bem-vindo à nossa loja!</h2>
    <p>Em breve, novidades para você.</p>
  </main>

  <script>
    function mostrarMensagem() {
      alert("Nossa coleção está chegando!");
    }
  </script>
</body>
</html>
